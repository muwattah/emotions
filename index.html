<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المشاعر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <main>
    <header>
      <p class="kicker">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <h1>كيف تشعر الآن؟</h1>
      <p class="lead">اختر شعورًا، يظهر لك آية أو حديث.</p>
    </header>
    <section class="emotions" id="emotions" aria-label="المشاعر"></section>
    <section class="card hidden" id="result" aria-live="polite">
      <button class="close" id="close" aria-label="إغلاق">×</button>
      <p class="emotion-label" id="result-emotion"></p>
      <p class="arabic" id="arabic" dir="rtl" lang="ar"></p>
      <p class="ref" id="ref"></p>
      <button class="again" id="again">حديث أو آية أخرى</button>
    </section>
  </main>
  <script src="data.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
